services:
  - type: web
    name: worksphere-job-portal
    env: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/jobs
    envVars:
      - key: PORT
        value: 8080
      - key: RACK_ENV
        value: production
    disk:
      name: sqlite-data
      mountPath: /app/data
      sizeGB: 1
